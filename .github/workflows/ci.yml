name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Test manual production smoke harness (offline, no network)
        run: node --test .github/scripts/read-only-production-smoke.test.mjs

      - name: Test release-alignment audit (offline, no network)
        run: node --test .github/scripts/release-readiness.test.mjs

      - name: Test production-smoke mutation guard (offline, no network)
        run: node --test .github/scripts/live-smoke-consent.test.mjs

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          FLOWCRAFT_API_ORIGIN: https://api.example.test
          NEXT_PUBLIC_SOCKET_URL: https://socket.example.test

  e2e:
    name: Playwright critical journeys
    runs-on: ubuntu-latest
    # Browser downloads can stall during upstream incidents. Keep an explicit
    # upper bound, and report OS dependencies separately from browser fetching.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install Linux browser dependencies
        run: npx playwright install-deps chromium
        working-directory: client
        timeout-minutes: 10

      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: client
        timeout-minutes: 18

      - name: Run browser tests
        run: npm run test:e2e
        working-directory: client
        env:
          CI: true

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            client/playwright-report/
            client/test-results/
          if-no-files-found: ignore
          retention-days: 7
